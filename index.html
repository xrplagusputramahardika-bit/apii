<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --bg: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.05) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 28px;
            box-shadow: var(--shadow);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
        }

        .header-icon {
            width: 42px;
            height: 42px;
            background: #e0e7ff;
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.875rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }

        .btn-action {
            width: 34px;
            height: 34px;
            padding: 0;
            justify-content: center;
            border-radius: 10px;
        }

        .btn-edit {
            background: #fef3c7;
            color: #d97706;
        }

        .btn-edit:hover {
            background: #fde68a;
            transform: scale(1.05);
        }

        .btn-delete {
            background: #ffe4e6;
            color: #e11d48;
        }

        .btn-delete:hover {
            background: #fecdd3;
            transform: scale(1.05);
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background: #fff;
        }

        th {
            background: #f8fafc;
            color: var(--text-muted);
            padding: 16px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.875rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.875rem;
        }

        .badge {
            background: #f1f5f9;
            color: #475569;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .location-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .page-btn {
            padding: 8px 14px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 4px;
            font-weight: 600;
            transition: 0.2s;
        }

        .page-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        /* Modal Design */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: fadeIn 0.2s ease;
        }

        .modal-content {
            background: #fff;
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: #e2e8f0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-group input {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            outline: none;
            font-family: inherit;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <h2>
                    <div class="header-icon"><i class="fa-solid fa-users"></i></div>
                    Data Users
                </h2>
                <button class="btn btn-primary" onclick="openModal('add')">
                    <i class="fa-solid fa-plus"></i> Tambah User
                </button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th width="60">ID</th>
                            <th>User</th>
                            <th>Email</th>
                            <th>Lokasi</th>
                            <th>Kontak</th>
                            <th width="100" style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="userTable">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i><br><br>Memuat data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <span id="pageInfo"></span>
                <div id="pageNav"></div>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Tambah User</h3>
                <div class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></div>
            </div>
            <form id="userForm" onsubmit="saveUser(event)">
                <input type="hidden" id="userId">

                <div class="form-grid">
                    <div class="form-group full">
                        <label>Nama Lengkap</label>
                        <input type="text" id="name" required placeholder="Contoh: Budi Pratama">
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" required placeholder="budipratama">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required placeholder="budi@example.com">
                    </div>
                    <div class="form-group">
                        <label>Kota</label>
                        <input type="text" id="city" placeholder="Jakarta">
                    </div>
                    <div class="form-group">
                        <label>Jalan / Alamat</label>
                        <input type="text" id="street" placeholder="Jl. Sudirman No. 12">
                    </div>
                    <div class="form-group">
                        <label>Suite / Apt</label>
                        <input type="text" id="suite" placeholder="Apt. 556">
                    </div>
                    <div class="form-group">
                        <label>Kode Pos</label>
                        <input type="text" id="zipcode" placeholder="12345">
                    </div>
                    <div class="form-group full">
                        <label>Telepon</label>
                        <input type="text" id="phone" placeholder="08123456789">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()"
                        style="background:#f1f5f9; flex:1; justify-content: center;">Batal</button>
                    <button type="submit" class="btn btn-primary"
                        style="flex:1; justify-content: center;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let usersData = [];
        let currentPage = 1;
        const limitPerPage = 10;

        function escapeHtml(str) {
            if (!str) return '-';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getInitial(name) {
            return name ? name.charAt(0).toUpperCase() : '?';
        }

        function loadUsers() {
            fetch('data_json.php')
                .then(res => res.json())
                .then(data => {
                    usersData = Array.isArray(data) ? data : [];
                    renderTable();
                })
                .catch(err => {
                    console.error('Error fetching data:', err);
                    document.getElementById("userTable").innerHTML = `<tr><td colspan="6" style="text-align:center; color:red; padding:20px;">Gagal memuat data.</td></tr>`;
                });
        }

        function renderTable() {
            const total = usersData.length;
            const totalPages = Math.ceil(total / limitPerPage) || 1;

            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * limitPerPage;
            const end = start + limitPerPage;
            const currentData = usersData.slice(start, end);

            let html = "";
            currentData.forEach(item => {
                const city = item.address && item.address.city ? item.address.city : '-';
                const zipcode = item.address && item.address.zipcode ? ` (${item.address.zipcode})` : '';

                html += `
                <tr>
                    <td><span style="font-weight: 700; color: var(--text-muted);">#${item.id}</span></td>
                    <td>
                        <div class="user-info">
                            <div class="avatar">${getInitial(item.name)}</div>
                            <div>
                                <div style="font-weight: 600;">${escapeHtml(item.name)}</div>
                                <span class="badge">@${escapeHtml(item.username)}</span>
                            </div>
                        </div>
                    </td>
                    <td style="color: var(--text-muted);">${escapeHtml(item.email)}</td>
                    <td>
                        <div class="location-tag">
                            <i class="fa-solid fa-location-dot" style="font-size: 0.75rem; color: var(--primary);"></i>
                            ${escapeHtml(city)}${escapeHtml(zipcode)}
                        </div>
                    </td>
                    <td style="color: var(--text-muted);">${escapeHtml(item.phone)}</td>
                    <td style="text-align: center;">
                        <button onclick="openModal('edit', ${item.id})" class="btn btn-action btn-edit" title="Edit"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteUser(${item.id})" class="btn btn-action btn-delete" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            });

            document.getElementById("userTable").innerHTML = html || `<tr><td colspan="6" style="text-align:center; padding: 20px;">Data kosong.</td></tr>`;
            document.getElementById("pageInfo").innerText = `Menampilkan ${total === 0 ? 0 : start + 1} - ${Math.min(end, total)} dari ${total} data`;

            let navHtml = "";
            for (let i = 1; i <= totalPages; i++) {
                navHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }
            document.getElementById("pageNav").innerHTML = navHtml;
        }

        function changePage(page) {
            currentPage = page;
            renderTable();
        }

        function openModal(mode, id = null) {
            document.getElementById("userForm").reset();
            if (mode === 'edit' && id) {
                document.getElementById("modalTitle").innerText = "Edit User #" + id;
                const user = usersData.find(u => u.id == id);
                if (user) {
                    document.getElementById("userId").value = user.id;
                    document.getElementById("name").value = user.name || '';
                    document.getElementById("username").value = user.username || '';
                    document.getElementById("email").value = user.email || '';
                    document.getElementById("city").value = (user.address && user.address.city) ? user.address.city : '';
                    document.getElementById("street").value = (user.address && user.address.street) ? user.address.street : '';
                    document.getElementById("suite").value = (user.address && user.address.suite) ? user.address.suite : '';
                    document.getElementById("zipcode").value = (user.address && user.address.zipcode) ? user.address.zipcode : '';
                    document.getElementById("phone").value = user.phone || '';
                }
            } else {
                document.getElementById("modalTitle").innerText = "Tambah User Baru";
                document.getElementById("userId").value = "";
            }
            document.getElementById("userModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("userModal").style.display = "none";
        }

        function saveUser(e) {
            e.preventDefault();
            const id = document.getElementById("userId").value;
            const method = id ? 'PUT' : 'POST';
            const payload = {
                name: document.getElementById("name").value,
                username: document.getElementById("username").value,
                email: document.getElementById("email").value,
                city: document.getElementById("city").value,
                street: document.getElementById("street").value,
                suite: document.getElementById("suite").value,
                zipcode: document.getElementById("zipcode").value,
                phone: document.getElementById("phone").value
            };
            if (id) payload.id = parseInt(id);

            fetch('proses.php', {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(res => res.json())
                .then(res => {
                    alert(res.message);
                    closeModal();
                    loadUsers();
                })
                .catch(err => console.error('Error saving user:', err));
        }

        function deleteUser(id) {
            if (confirm("Yakin ingin menghapus user ini?")) {
                fetch('proses.php', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                })
                    .then(res => res.json())
                    .then(res => {
                        alert(res.message);
                        loadUsers();
                    })
                    .catch(err => console.error('Error deleting user:', err));
            }
        }

        document.addEventListener("DOMContentLoaded", loadUsers);
    </script>

</body>

</html>
